# RoundTable — Docker Compose (standalone)
# Works on any Docker host. Backend image builds web/ (node stage) and serves
# the SPA from FastAPI on :8000. Copy .env.example -> .env and fill secrets.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MC_DB_USER:-mcuser}
      POSTGRES_PASSWORD: ${MC_DB_PASSWORD:?set MC_DB_PASSWORD in .env}
      POSTGRES_DB: ${MC_DB_NAME:-roundtable}
    volumes:
      - rt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MC_DB_USER:-mcuser} -d ${MC_DB_NAME:-roundtable}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    image: roundtable:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${MC_DB_USER:-mcuser}:${MC_DB_PASSWORD}@db:5432/${MC_DB_NAME:-roundtable}
      OPERATOR_USERNAME: ${MC_OPERATOR_USERNAME:-doomerius}
      OPERATOR_PASSWORD: ${MC_OPERATOR_PASSWORD:?set MC_OPERATOR_PASSWORD in .env}
      SESSION_SECRET: ${MC_SESSION_SECRET:?set MC_SESSION_SECRET in .env}
      PUBLIC_BASE_URL: ${MC_PUBLIC_BASE_URL:-http://localhost:8000}
      AGENT_SEEDS: ${MC_AGENT_SEEDS:-jaeger=JAEGER=Data+Trials,percival=Percival=Evidence,bedivere=BEDIVERE=Integrity,galahad=GALAHAD=Coordination}
      COOKIE_SECURE: ${MC_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${MC_CORS_ORIGINS:-*}
      DATA_DIR: /srv/data
    volumes:
      - rt-data:/srv/data
    ports:
      - "${MC_PORT:-8000}:8000"

volumes:
  rt-postgres:
  rt-data:
