# Mission Control — Coolify compose (server delta). API + Postgres.
# Domain (set in Coolify): https://missions.blxmp.dk
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcuser
      POSTGRES_PASSWORD: ${MC_DB_PASSWORD:?set in Coolify envs}
      POSTGRES_DB: mission_control
    volumes:
      - mc-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcuser -d mission_control"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: https://github.com/wckdboy/mission-control.git#main
    image: mission-control:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://mcuser:${MC_DB_PASSWORD}@db:5432/mission_control
      OPERATOR_USERNAME: ${MC_OPERATOR_USERNAME:-doomerius}
      OPERATOR_PASSWORD: ${MC_OPERATOR_PASSWORD:?set in Coolify envs}
      SESSION_SECRET: ${MC_SESSION_SECRET:?set in Coolify envs}
      PUBLIC_BASE_URL: ${MC_PUBLIC_BASE_URL:-https://missions.blxmp.dk}
      AGENT_SEEDS: ${MC_AGENT_SEEDS:-jaeger=JAEGER=Data+Trials,percival=Percival=Evidence,bedivere=BEDIVERE=Integrity,galahad=GALAHAD=Coordination}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${MC_CORS_ORIGINS:-https://missions.blxmp.dk}
    volumes:
      - mc-data:/srv/data
    expose:
      - "8000"

volumes:
  mc-postgres:
  mc-data:
